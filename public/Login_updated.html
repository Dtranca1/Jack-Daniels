<!DOCTYPE html>
<html lang="en">
<!-- The following HTML file represents a login page for a web application. It includes a form for users to enter their email and password, and it uses JavaScript to handle the form submission and communicate with the server for authentication. -->
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webapp Login</title>
    <link rel="stylesheet" type="text/css" href="styles3.css">
</head>

<body>
    <header>
        <h1>Webapp</h1>
        <p>Log in to continue.</p>
    </header>

    <main>
        <section>
            <form id="login" name="login">
                <fieldset>
                    <legend><strong>Login</strong></legend>

                    <p>
                        <label for="email">Email:</label><br>
                        <input type="email" name="email" id="email"
                               size="30" placeholder="Email Address"
                               autocomplete="username" required>
                    </p>

                    <p>
                        <label for="password">Password:</label><br>
                        <input type="password" name="password" id="password"
                               size="30" placeholder="Password"
                               autocomplete="current-password" required>
                    </p>

                    <p>
                        <input id="submit" type="submit" value="Login">
                        <input id="reset" type="reset" value="Reset">
                    </p>
                    <p>Don't have an account? <a href="Registration.html">Register</a>.</p>
                    <p id="login-message" role="status" aria-live="polite"></p>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p id="validation">
            <a href="https://validator.w3.org/nu/" title="HTML5 Validation">
                HTML5 Validation
            </a>
        </p>
    </footer>
    <script>
        // The following script handles the login form submission, sending the email and password to the server for authentication. It also manages the UI feedback during the login process.
        const loginForm = document.getElementById("login");

        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();
// Retrieve the email and password values from the form inputs, trimming whitespace from the email.
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const submitButton = document.getElementById("submit");
            const message = document.getElementById("login-message");

            message.textContent = "";
            submitButton.disabled = true;
            submitButton.value = "Logging in...";
// The fetch request is sent to the server's login endpoint, and the response is handled accordingly. If the login is successful, the user is redirected to the dashboard, and their email is stored in sessionStorage. If there's an error, an appropriate message is displayed.
            try {
                const response = await fetch("http://localhost:3000/api/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        Password: password
                    })
                });

                const result = await response.json().catch(() => ({}));

                if (!response.ok) {
                    throw new Error(result.message || "Login failed. Check your email and password.");
                }

                // Redirect only after the server confirms a successful login.
                // Store the email only after successful authentication. Never store the password.
                sessionStorage.setItem("loggedInEmail", email);
                // also save loggedinUID
                sessionStorage.setItem("loggedInUID", String(result.user.uID));
                window.location.href = "dashboard.html";
            } catch (error) {
                message.textContent = error.message || "Could not connect to the login server.";
                submitButton.disabled = false;
                submitButton.value = "Login";
            }
        });
        sessionStorage.setItem('loggedInUID', user.uID);
        sessionStorage.setItem('loggedInEmail', user.email);
    </script>
</body>
</html>
