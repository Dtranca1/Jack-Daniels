<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Mockup</title>
  <link href="../public/css/bootstrap.min.css" rel="stylesheet">
  <link href="../public/css/dashboard-styles.css" rel="stylesheet">
</head>
<body>
  <main class="dashboard" aria-label="Calendar dashboard mockup">
    <header class="topbar">
      <div class="avatar" aria-label="User profile placeholder"></div>
      <div class="username">Username</div>
      <div class="date">10/31/2026</div>
    </header>
    <aside class="sidebar" aria-label="Color categories">
      <div class="color-tab red" title="Red category"></div>
      <div class="color-tab blue" title="Blue category"></div>
      <div class="color-tab yellow" title="Yellow category"></div>
      <div class="add-control">
        <button class="add-button btn p-0" id="addToggle" type="button" aria-label="Open create menu" aria-expanded="false" aria-controls="addMenu"></button>
        <button class="add-menu btn" id="addMenu" type="button" aria-label="Create new item">New</button>
      </div>
    </aside>
    <section class="workspace" aria-label="Calendar grid">
      <div class="calendar-grid" role="grid" aria-label="Blank calendar">
        <div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div>
        <div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div>
        <div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div>
        <div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div>
        <div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div>
      </div>
    </section>
  </main>
  <script>
    const addToggle = document.getElementById('addToggle');
    const addMenu = document.getElementById('addMenu');
    addToggle.addEventListener('click', () => {
      const isOpen = addMenu.classList.toggle('show');
      addToggle.setAttribute('aria-expanded', String(isOpen));
    });
    document.addEventListener('click', (event) => {
      if (!event.target.closest('.add-control')) {
        addMenu.classList.remove('show');
        addToggle.setAttribute('aria-expanded', 'false');
      }
    });
    addMenu.addEventListener('click', () => {
      addMenu.classList.remove('show');
      addToggle.setAttribute('aria-expanded', 'false');
      // Add your create-new-item action here.
    });
  </script>
</body>
</html>
