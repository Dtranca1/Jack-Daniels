<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <link href="/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap CSS -->
  <style>
    :root { --ink:#303030; --panel:#898989; --line:#444; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 28px; background: #fff; font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
    }
    .dashboard {
      width: min(1180px, 100%); min-height: 620px; display: grid;
      grid-template-columns: 150px minmax(0, 1fr); grid-template-rows: 128px minmax(400px, auto);
      overflow: hidden; border-radius: 54px; background: var(--panel); color: #fff;
      box-shadow: 0 0 0 1px rgba(0,0,0,.05);
    }
    .topbar {
      grid-column: 1 / -1; display:flex; align-items:center; gap: 22px;
      padding: 25px 6.2% 25px 36px; background: var(--ink); border-bottom: 3px solid #666;
    }
    .avatar { width: 82px; height: 58px; flex: 0 0 auto; background:#fff; border-radius:50%; }
    .username, .date { font-size: clamp(20px, 2.3vw, 32px); font-weight: 900; line-height:1; }
    .date { margin-left:auto; white-space:nowrap; }
    .sidebar {
      position:relative; display:flex; flex-direction:column; align-items:center; gap:15px;
      padding: 4px 18px 48px; background:var(--ink); border-right:3px solid #666;
    }
    .color-tab { width:100%; max-width:112px; height:40px; border-radius:20px; flex:0 0 auto; }
    .red { background:#f02e32; } .blue { background:#303fe8; } .yellow { background:#f1ed2d; }
    .add-button {
      position:absolute; bottom:47px; left:50%; transform:translateX(-50%); width:72px; height:68px;
      display:grid; place-items:center; border-radius:50%; background:#929292; color:#303030;
    }
    .add-button::before, .add-button::after { content:""; position:absolute; background:#303030; border-radius:3px; }
    .add-button::before { width:48px; height:7px; }
    .add-button::after { width:7px; height:48px; }
    .workspace { position:relative; min-width:0; padding: 74px 6.3% 58px; background:#898989; }
    .calendar-grid { display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); grid-template-rows:repeat(5, minmax(55px, 1fr)); min-height: 305px; background:#fff; border-top:1px solid var(--line); border-left:1px solid var(--line); }
    .calendar-cell { border-right:2px solid var(--line); border-bottom:1px solid #666; background:#fff; }
    .calendar-cell:nth-child(7n) { border-right:0; }
    
    .new-item::before { content:""; position:absolute; width:83px; height:20px; left:-78px; top:79px; background:#555; transform:rotate(-12deg); z-index:-1; }
    @media (max-width: 700px) {
      body { padding:12px; }
      .dashboard { grid-template-columns:78px minmax(0,1fr); grid-template-rows:95px minmax(370px,auto); border-radius:30px; }
      .topbar { padding:18px; gap:12px; }
      .avatar { width:46px; height:40px; }
      .username,.date { font-size:clamp(14px,3vw,22px); }
      .sidebar { padding:8px 10px 42px; gap:12px; }
      .color-tab { height:28px; }
      .add-button { width:48px; height:46px; bottom:35px; }
      .add-button::before { width:32px; height:5px; }
      .add-button::after { width:5px; height:32px; }
      .workspace { padding:45px 14px 45px; }
      .calendar-grid { grid-template-rows:repeat(5,minmax(43px,1fr)); min-height:245px; }
      .calendar-cell { border-right-width:1px; }
      .new-item { left:2%; bottom:25px; width:100px; height:100px; border-radius:34px; font-size:22px; }
      .new-item::before { width:48px; left:-43px; top:52px; height:13px; }
    }
    @media (max-width:420px) { .date { font-size:13px; } .topbar { gap:8px; } .workspace { padding-left:8px; padding-right:8px; } }
  </style>

</head>
<!--Dashboard Rough Structure-->
<body>
  <main class="dashboard" aria-label="Calendar dashboard mockup">
    <header class="topbar">
      <div class="avatar" aria-label="User profile placeholder"></div>
      <div class="username">Username</div>
      <div class="date">10/31/2026</div>
    </header>
    <aside class="sidebar" aria-label="Color categories">
      <div class="color-tab red" title="Red category"></div>
      <div class="color-tab blue" title="Blue category"></div>
      <div class="color-tab yellow" title="Yellow category"></div>
      <button class="add-button btn p-0" type="button" aria-label="Add category"></button>
    </aside>
    <section class="workspace" aria-label="Calendar grid">
      <div class="calendar-grid" role="grid" aria-label="Blank calendar">
        <div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div>
        <div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div>
        <div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div>
        <div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div>
        <div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div><div class="calendar-cell" role="gridcell"></div>
      </div>
    </section>
  </main>
</body>
</html>
